      - "complete versioned operation/feature negotiation and observed-target-revision binding before claiming a production or dharma_swarm adapter receipt"
      - "P0 OPERATOR GATE: issue #60 may authorize one exact VB-008 or VB-010 foreign-target confirmation or its predeclared null; execute neither without separate human approval of repository, revision, license, data boundary, oracle, fixed budget, and disposable environment"
      - "serialize writes to shared scripts/gate.sh, Cargo.toml, Cargo.lock, and ACTIVE_TRACK.yaml under one named writer; verifier-owned surfaces still require an exact interface request"
      - "measure the representative shrink median (issue #59) and named-box Tier-1 throughput (issue #64) before claiming criteria 5 or 6"
    non_goals:
      - "a general Tier 3 hypervisor or arbitrary multithreaded-binary determinism promise; the only supervisor work permitted here is a docs-only proposal for a separately human-ratified Linux x86-64 one-process/one-thread spike"
      - "the Reality Bridge grants no unsafe code or external dependency absent an explicit same-PR determinism review and named operator-ratified exception; it grants no helper implementation, sibling repository creation, unratified foreign-target execution, credential use, spending, paid-provider call, merge, approval, or self-approval authority"
