name: Reproducible bug
description: Report a defect with a runnable reproducer and honest evidence boundary.
title: "[BUG] "
labels:
  - bug
  - triage
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include exact command, exit code, and bounded output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Pin commit, toolchain, seed, workload, universe, and platform where relevant.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence state
      options:
        - Reproduced locally
        - Reproduced in CI
        - External report, not reproduced
        - Suspected only
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Claim boundary and counterevidence
      description: What does this reproduce not prove? What evidence points the other way?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed secrets, credentials, production data, and private target details.
          required: true
